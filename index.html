<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9a43f5"><title>Móc khóa • Cute </title><style>
:root{--purple:#9a43f5;--ink:#29213b;--muted:#81788f;--card:#fff;--bg:#f7f2ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#f8f2ff,#f4f7ff 60%,#fff4fb);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);padding:18px 14px 32px}.app{max-width:520px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin:4px 2px 18px}.logo{width:48px;height:48px;border-radius:17px;background:#eadbff;display:grid;place-items:center;font-size:26px}.top h1{font-size:21px;margin:0}.top p{margin:3px 0 0;color:var(--muted);font-size:13px}.panel{background:rgba(255,255,255,.92);border:1px solid #eee6fb;border-radius:23px;padding:17px;margin:12px 0;box-shadow:0 8px 25px #5d2d8d0c}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionhead h2{font-size:16px;margin:0}.pill{font-size:11px;background:#f0e5ff;color:#713ac4;border-radius:99px;padding:6px 9px;font-weight:700}.devicearea{display:flex;justify-content:center;padding:8px 0 16px}.device{background:linear-gradient(145deg,#24212d,#0d0c12);border-radius:24px;padding:10px 12px 12px;box-shadow:0 12px 25px #2d174333;width:min(100%,350px)}.screen{width:100%;aspect-ratio:320/172;border-radius:11px;background:var(--purple);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:flex-start;color:#fff}.screen img{width:100%;height:100%;object-fit:cover;display:none}.screenText{white-space:nowrap;font-size:18px;font-weight:800;letter-spacing:.2px;padding-left:0;animation:move 4s linear infinite}.screenText.paused{animation-play-state:paused}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(340px)}}.devicecaption{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}.connectrow{display:flex;gap:8px}.btn{border:0;border-radius:14px;padding:12px 13px;font:inherit;font-weight:750;background:var(--purple);color:white;cursor:pointer}.btn:active{transform:scale(.98)}.btn.secondary{background:#f0e6ff;color:#6334a8}.btn.full{width:100%}.status{font-size:12px;color:#766b85;margin:10px 1px 0;line-height:1.4}.field{margin:13px 0}.field label{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;margin-bottom:7px}.field input[type=text]{width:100%;border:1px solid #e5dced;background:#fff;border-radius:12px;padding:12px;font:inherit;outline-color:var(--purple)}.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.colorbox{display:flex;align-items:center;gap:9px;border:1px solid #eee5f7;border-radius:14px;padding:8px}.colorbox input{width:35px;height:35px;border:0;padding:0;background:transparent}.colorbox span{font-size:12px;font-weight:700}.range{width:100%;accent-color:var(--purple)}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.preset{border:1px solid #eadcfb;background:#fcfaff;border-radius:15px;padding:12px 5px;font-size:23px;cursor:pointer}.preset small{display:block;font-size:11px;color:var(--muted);font-weight:650;margin-top:3px}.filepick{display:block;border:1.5px dashed #d9c5f3;border-radius:15px;padding:14px;text-align:center;background:#fcfaff;color:#6c3bb1;font-weight:700;font-size:13px}.filepick input{display:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:11px;line-height:1.5;color:var(--muted);margin:10px 2px}.disabledhint{font-size:12px;color:#a44c63;background:#fff0f3;border-radius:12px;padding:10px;margin-top:10px}
</style></head><body><main class="app"><header class="top"><div class="logo">🎀</div><div><h1>Móc khóa • Control</h1><p>Chỉnh màn hình móc khóa của bạn</p></div></header>
<section class="panel"><div class="sectionhead"><h2>✨ Xem trước màn hình</h2><span class="pill">320 × 172 TFT · Ngang</span></div><div class="devicearea"><div><div class="device"><div class="screen" id="screen"><span class="screenText" id="previewText">hello</span><img id="previewImg" alt="Ảnh xem trước"></div></div><div class="devicecaption">Mô phỏng màn hình móc khóa nằm ngang</div></div></div><div class="connectrow"><button class="btn full" id="connect">🔵 Kết nối BLE</button><button class="btn secondary" id="disconnect">Ngắt</button></div><div class="status" id="status">chưa kết nối.</div><div class="disabledhint"> chưa kết .</div></section>
<section class="panel"><div class="sectionhead"><h2>💬 Chữ chạy</h2><span class="pill">LIVE PREVIEW</span></div><div class="field"><label for="text">Nội dung chữ</label><input id="text" type="text" maxlength="80" value="hello"></div><div class="colors"><div class="field"><label>Màu chữ</label><div class="colorbox"><input id="fg" type="color" value="#ffffff"><span id="fgval">#FFFFFF</span></div></div><div class="field"><label>Màu nền</label><div class="colorbox"><input id="bg" type="color" value="#9a43f5"><span id="bgval">#9A43F5</span></div></div></div><div class="field"><label for="speed">Tốc độ chạy <span id="speedval">50%</span></label><input class="range" id="speed" type="range" min="1" max="100" value="50"></div><div class="actions"><button class="btn" id="run">▶ Chạy chữ</button><button class="btn secondary" id="pause">Ⅱ Tạm dừng</button></div></section>
<section class="panel"><div class="sectionhead"><h2>🖼️ Ảnh của bạn</h2><span class="pill">ẢNH</span></div><label class="filepick">＋ Chọn ảnh từ điện thoại<input id="photo" type="file" accept="image/*"></label><div class="actions" style="margin-top:10px"><button class="btn" id="showphoto">Hiện ảnh xem trước</button><button class="btn secondary" id="showtext">Quay lại chữ</button></div><p class="note">Ảnh sẽ hiển thị trong khung mô phỏng.</p></section>
<section class="panel"><div class="sectionhead"><h2>😊 Biểu cảm lưu sẵn</h2><span class="pill">6 MẪU</span></div><div class="presets"><button class="preset" data-text="♡">♡<small>Love</small></button><button class="preset" data-text="☆">☆<small>Star</small></button><button class="preset" data-text="☺">☺<small>Smile</small></button><button class="preset" data-text="♪">♪<small>Music</small></button><button class="preset" data-text="✿">✿<small>Flower</small></button><button class="preset" data-text="CUTIE!">✧<small>Cutie</small></button></div></section><p class="note"></p></main><script>
const $=id=>document.getElementById(id);let chosenImage='';function update(){const fg=$('fg').value,bg=$('bg').value,t=$('text').value||' ';$('screen').style.background=bg;$('previewText').style.color=fg;$('previewText').textContent=t;$('fgval').textContent=fg.toUpperCase();$('bgval').textContent=bg.toUpperCase();$('speedval').textContent=$('speed').value+'%';$('previewText').style.animationDuration=(8-(Number($('speed').value)*.065))+'s'}['text','fg','bg','speed'].forEach(id=>$(id).addEventListener('input',update));$('run').onclick=()=>{$('previewText').classList.remove('paused');$('previewText').style.animationPlayState='running';$('previewImg').style.display='none';$('previewText').style.display='inline';$('status').textContent='Đang xem trước chữ chạy · Chưa gửi tới thiết bị.'};$('pause').onclick=()=>{$('previewText').classList.add('paused');$('status').textContent='Đã tạm dừng xem trước.'};document.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{$('text').value=b.dataset.text;update();$('previewImg').style.display='none';$('previewText').style.display='inline'});$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;chosenImage=URL.createObjectURL(f);$('previewImg').src=chosenImage;$('status').textContent='Đã chọn '+f.name+' · Nhấn “Hiện ảnh xem trước”.'};$('showphoto').onclick=()=>{if(!chosenImage){$('status').textContent='Chọn ảnh trước nhé.';return}$('previewImg').style.display='block';$('previewText').style.display='none';$('status').textContent='Đang xem trước ảnh · Chưa gửi tới thiết bị.'};$('showtext').onclick=()=>{$('previewImg').style.display='none';$('previewText').style.display='inline';update()};$('connect').onclick=()=>{$('status').textContent='Chưa thể kết nối: cần ESP32-C3 thật, đã nạp firmware BLE tương thích và trang HTTPS hỗ trợ Web Bluetooth.'};$('disconnect').onclick=()=>{$('status').textContent='Đang ở chế độ xem thử · Không có thiết bị kết nối.'};update();
</script></body></html>
